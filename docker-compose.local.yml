services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "9081:8000"
    environment:
      - APP_ENV=development
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - MAX_FILE_SIZE_MB=10
    volumes:
      - chroma_data:/app/chroma_db
      - ./backend:/app          # hot-reload in dev
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    ports:
      - "9080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
